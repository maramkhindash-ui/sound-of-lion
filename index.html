  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>من صاحب الصوت؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#BFEFFF;
    --sky-bottom:#FFF7E0;
    --sun:#FFC93C;
    --coral:#FF6F61;
    --grass:#48B27A;
    --grass-dark:#2E8B57;
    --plum:#4A2E5C;
    --card-bg:#FFFFFF;
    --card-shadow: 0 10px 0 rgba(0,0,0,0.08);
    --radius-lg: 32px;
    --radius-md: 22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Cairo', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 65%, #FFEFC2 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    color:var(--plum);
    position:relative;
  }
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50%;
    opacity:0.8;
    filter: blur(0.5px);
  }
  #stage{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:transparent;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:18px 18px 28px;
    z-index:2;
  }
  .screen{ display:none; flex-direction:column; flex:1; animation: fadeIn .45s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Header (game screen) ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .level-badge{
    background:var(--plum);
    color:#fff;
    font-family:'Lalezar', sans-serif;
    font-size:18px;
    padding:8px 18px;
    border-radius:999px;
    letter-spacing:0.5px;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .restart-btn{
    background:#fff;
    border:none;
    width:46px;
    height:46px;
    border-radius:50%;
    box-shadow:0 4px 0 rgba(0,0,0,0.1);
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .15s;
  }
  .restart-btn:active{ transform: scale(0.9) rotate(-25deg); }

  .progress-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:16px;
  }
  .dot{
    width:20px; height:20px;
    border-radius:50%;
    background:#fff;
    border:3px solid #E3D9C6;
    transition: all .3s ease;
  }
  .dot.filled{
    background: var(--sun);
    border-color: var(--sun);
    transform: scale(1.15);
    box-shadow:0 0 0 4px rgba(255,201,60,0.35);
  }
  .dot.shake-reset{ animation: dotPop .4s ease; }
  @keyframes dotPop{ 0%{transform:scale(1.15);} 50%{transform:scale(0.7) rotate(180deg); background:#f5f5f5;} 100%{transform:scale(1);} }

  /* ---------- Sound / question panel ---------- */
  .sound-panel{
    background:var(--card-bg);
    border-radius:var(--radius-lg);
    box-shadow: var(--card-shadow);
    padding:22px 18px;
    text-align:center;
    margin-bottom:18px;
    position:relative;
  }
  .prompt-text{
    font-family:'Lalezar', sans-serif;
    font-size:22px;
    color:var(--plum);
    margin:0 0 14px;
  }
  .replay-btn{
    background: linear-gradient(180deg, #FFD873, var(--sun));
    border:none;
    border-radius:50%;
    width:96px; height:96px;
    box-shadow:0 6px 0 #D69E1F;
    font-size:42px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition: transform .12s;
    color:#7A4E00;
  }
  .replay-btn:active{ transform: translateY(4px); box-shadow:0 2px 0 #D69E1F; }
  .replay-btn.pulse{ animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 6px 0 #D69E1F, 0 0 0 0 rgba(255,201,60,0.5);}
    50%{ box-shadow:0 6px 0 #D69E1F, 0 0 0 14px rgba(255,201,60,0);}
  }
  .replay-label{
    margin-top:10px;
    font-size:14px;
    color:#8A7A5C;
    font-weight:600;
  }

  /* ---------- Answer cards (stacked vertically) ---------- */
  .answers{
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
  }
  .answer-card{
    background:var(--card-bg);
    border-radius:var(--radius-md);
    box-shadow: var(--card-shadow);
    border:4px solid transparent;
    padding:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    height:120px;
    position:relative;
    transition: transform .12s, border-color .2s, box-shadow .2s;
  }
  .answer-card:active{ transform: scale(0.97); }
  .answer-card img{
    max-height:104px;
    max-width:90%;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .answer-card.correct-flash{
    border-color: var(--grass);
    background:#EAFBF1;
    animation: correctBounce .55s ease;
  }
  .answer-card.wrong-flash{
    border-color: var(--coral);
    background:#FFEEEC;
    animation: shake .5s ease;
  }
  .answer-card.disabled{ pointer-events:none; opacity:0.55; }
  @keyframes correctBounce{
    0%{transform:scale(1);} 30%{transform:scale(1.06);} 60%{transform:scale(0.98);} 100%{transform:scale(1);}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-10px);}
    40%{transform:translateX(10px);}
    60%{transform:translateX(-7px);}
    80%{transform:translateX(7px);}
  }
  .badge-icon{
    position:absolute;
    top:8px;
    left:8px;
    font-size:26px;
    opacity:0;
    transform: scale(0.5);
    transition: all .25s ease;
  }
  .answer-card.correct-flash .badge-icon.check,
  .answer-card.wrong-flash .badge-icon.cross{
    opacity:1;
    transform: scale(1);
  }

  /* ---------- Start screen ---------- */
  #screen-start{
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:10px;
  }
  .hero-title{
    font-family:'Lalezar', sans-serif;
    font-size:40px;
    color:var(--plum);
    margin:0 0 6px;
    line-height:1.3;
  }
  .hero-sub{
    font-size:16px;
    color:#6B5B45;
    margin:0 0 28px;
    font-weight:600;
  }
  .hero-animals{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:10px;
  }
  .hero-animals img{
    width:88px;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,0.15));
    animation: bob 3s ease-in-out infinite;
  }
  .hero-animals img:nth-child(2){ animation-delay:.4s; width:78px; margin-top:14px;}
  .hero-animals img:nth-child(3){ animation-delay:.8s; width:70px; margin-top:22px;}
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }

  .start-btn{
    font-family:'Lalezar', sans-serif;
    font-size:26px;
    background: linear-gradient(180deg, #6FD199, var(--grass-dark));
    color:#fff;
    border:none;
    padding:16px 56px;
    border-radius:999px;
    box-shadow:0 7px 0 #1F6E45;
    cursor:pointer;
    letter-spacing:1px;
    transition: transform .12s;
  }
  .start-btn:active{ transform:translateY(5px); box-shadow:0 2px 0 #1F6E45; }

  /* ---------- Celebration / level complete ---------- */
  #screen-celebrate{
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .celebrate-emoji{ font-size:80px; margin-bottom:6px; animation: popIn .5s ease; }
  @keyframes popIn{ 0%{transform:scale(0);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }
  .celebrate-title{ font-family:'Lalezar', sans-serif; font-size:32px; color:var(--plum); margin:0 0 8px;}
  .celebrate-sub{ font-size:16px; color:#6B5B45; font-weight:600; margin-bottom:26px;}
  .confetti{
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; overflow:hidden;
  }
  .confetti span{
    position:absolute;
    top:-10%;
    font-size:22px;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(360deg); opacity:0.9; }
  }

  .next-btn{
    font-family:'Lalezar', sans-serif;
    font-size:22px;
    background: linear-gradient(180deg, #FF9B8F, var(--coral));
    color:#fff;
    border:none;
    padding:14px 44px;
    border-radius:999px;
    box-shadow:0 6px 0 #C4443A;
    cursor:pointer;
    transition: transform .12s;
  }
  .next-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #C4443A; }

  @media (max-height: 700px){
    .answer-card{ height:100px; }
    .hero-animals img{ width:70px; }
    .hero-title{ font-size:32px; }
  }

  /* ---------- Voice recording panel ---------- */
  .record-panel{
    background:var(--card-bg);
    border-radius:var(--radius-lg);
    box-shadow: var(--card-shadow);
    padding:18px 16px;
    margin-top:18px;
    text-align:center;
  }
  .record-title{
    font-size:15px;
    color:var(--plum);
    font-weight:700;
    margin:0 0 12px;
  }
  .record-controls{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .record-btn, .playback-btn{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:14px;
    border:none;
    border-radius:999px;
    padding:12px 16px;
    cursor:pointer;
    transition: transform .12s;
  }
  .record-btn{
    background: linear-gradient(180deg, #FF9B8F, var(--coral));
    color:#fff;
    box-shadow:0 5px 0 #C4443A;
  }
  .record-btn.recording{
    background: linear-gradient(180deg, #FF5B5B, #D62C2C);
    animation: recPulse 1s ease-in-out infinite;
  }
  @keyframes recPulse{
    0%,100%{ box-shadow:0 5px 0 #C4443A, 0 0 0 0 rgba(255,60,60,0.5);}
    50%{ box-shadow:0 5px 0 #C4443A, 0 0 0 10px rgba(255,60,60,0);}
  }
  .playback-btn{
    background: linear-gradient(180deg, #8FD3FF, #4AA9E0);
    color:#fff;
    box-shadow:0 5px 0 #2A7DAE;
  }
  .playback-btn:disabled{
    opacity:0.45;
    cursor:not-allowed;
    box-shadow:none;
  }
  .record-btn:active, .playback-btn:active{ transform:translateY(3px); }
  .record-status{
    margin-top:10px;
    font-size:13px;
    color:#8A7A5C;
    min-height:18px;
    font-weight:600;
  }
  .mom-review{
    margin-top:16px;
    padding-top:16px;
    border-top:2px dashed #EEE3CE;
  }
  .mom-review-title{
    font-size:14px;
    color:#6B5B45;
    font-weight:700;
    margin:0 0 10px;
  }
  .mom-buttons{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .mom-btn{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:14px;
    border:none;
    border-radius:999px;
    padding:11px 16px;
    cursor:pointer;
    transition: transform .12s;
  }
  .mom-btn.success{
    background: linear-gradient(180deg, #6FD199, var(--grass-dark));
    color:#fff;
    box-shadow:0 5px 0 #1F6E45;
  }
  .mom-btn.needs-review{
    background: linear-gradient(180deg, #FFD873, var(--sun));
    color:#7A4E00;
    box-shadow:0 5px 0 #D69E1F;
  }
  .mom-btn:active{ transform:translateY(3px); }
  .mom-btn.selected{ outline:3px solid var(--plum); }
  .mom-result{
    margin-top:10px;
    font-size:14px;
    font-weight:700;
    color:var(--plum);
    min-height:18px;
  }
</style>
</head>

  };
  const NAMES = { lion: "أسد", cat: "قطة", dog: "كلب", cat_orange: "قطة" };
  const CORRECT_KEY = "lion";

  const LEVELS = [
    { animals: ["lion","cat","dog"], label: "المستوى 1" },
    { animals: ["lion","cat","dog","cat_orange"], label: "المستوى 2" }
  ];

  const NEEDED_STREAK = 5;
  const SOUND_GAP = 4000; // 4 seconds between sounds

  let levelIndex = 0;
  let streak = 0;
  let locked = false; // prevent double taps while resolving a round
  let lastOrder = null;

  const screenStart = document.getElementById('screen-start');
  const screenGame = document.getElementById('screen-game');
  const screenCelebrate = document.getElementById('screen-celebrate');

  const levelBadge = document.getElementById('level-badge');
  const progressRow = document.getElementById('progress-row');
  const answersContainer = document.getElementById('answers-container');
  const btnReplay = document.getElementById('btn-replay');
  const btnStart = document.getElementById('btn-start');
  const btnRestartGame = document.getElementById('btn-restart-game');
  const btnNext = document.getElementById('btn-next');

  const celebrateEmoji = document.getElementById('celebrate-emoji');
  const celebrateTitle = document.getElementById('celebrate-title');
  const celebrateSub = document.getElementById('celebrate-sub');
  const confettiLayer = document.getElementById('confetti-layer');

  const audioQuestion = document.getElementById('audio-question');
  const audioLion = document.getElementById('audio-lion');
  const audioCorrect = document.getElementById('audio-correct');
  const audioWrong = document.getElementById('audio-wrong');

  function showScreen(el){
    [screenStart, screenGame, screenCelebrate].forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function playAudio(el){
    try{
      el.pause();
      el.currentTime = 0;
      el.play().catch(()=>{});
    }catch(e){}
  }

  function renderProgress(){
    progressRow.innerHTML = '';
    for(let i=0;i<NEEDED_STREAK;i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i < streak ? ' filled' : '');
      progressRow.appendChild(d);
    }
  }

  function buildRound(){
    locked = false;
    const level = LEVELS[levelIndex];
    levelBadge.textContent = level.label;
    renderProgress();

    let order = shuffle(level.animals);
    if(level.animals.length > 1 && lastOrder){
      let attempts = 0;
      while(order.join(',') === lastOrder.join(',') && attempts < 20){
        order = shuffle(level.animals);
        attempts++;
      }
    }
    lastOrder = order;
    answersContainer.innerHTML = '';
    order.forEach(key => {
      const card = document.createElement('div');
      card.className = 'answer-card';
      card.dataset.key = key;
      card.innerHTML = `
        <span class="badge-icon check">✅</span>
        <span class="badge-icon cross">❌</span>
        <img src="${IMAGES[key]}" alt="${NAMES[key]}">
      `;
      card.addEventListener('click', () => handleAnswer(card, key));
      answersContainer.appendChild(card);
    });

    // auto play: question sound first, then the target sound 1 second later
    playAudio(audioQuestion);
    setTimeout(() => playAudio(audioLion), SOUND_GAP);
  }

  function handleAnswer(card, key){
    if(locked) return;
    locked = true;
    document.querySelectorAll('.answer-card').forEach(c => c.classList.add('disabled'));

    if(key === CORRECT_KEY){
      card.classList.add('correct-flash');
      playAudio(audioCorrect);
      streak++;
      renderProgress();

      if(streak >= NEEDED_STREAK){
        setTimeout(() => levelComplete(), SOUND_GAP);
      } else {
        setTimeout(() => buildRound(), SOUND_GAP);
      }
    } else {
      card.classList.add('wrong-flash');
      playAudio(audioWrong);
      if(streak > 0){
        const dots = progressRow.querySelectorAll('.dot');
        dots.forEach(d => d.classList.add('shake-reset'));
      }
      streak = 0;
      setTimeout(() => {
        renderProgress();
        setTimeout(() => buildRound(), SOUND_GAP);
      }, 350);
    }
  }

  function spawnConfetti(){
    confettiLayer.innerHTML = '';
    const emojis = ['🎉','🎊','⭐','🌟','🐾'];
    for(let i=0;i<24;i++){
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = Math.random()*100 + '%';
      const dur = 2.2 + Math.random()*1.6;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (Math.random()*0.6) + 's';
      s.style.fontSize = (16 + Math.random()*14) + 'px';
      confettiLayer.appendChild(s);
    }
  }

  function levelComplete(){
    const isLast = levelIndex >= LEVELS.length - 1;
    spawnConfetti();
    if(isLast){
      celebrateEmoji.textContent = '🏆';
      celebrateTitle.textContent = 'رائع! أنهيت النشاط بنجاح!';
      celebrateSub.textContent = 'أنت خبير في أصوات الحيوانات 🐶';
      btnNext.textContent = 'العب من جديد 🔄';
      btnNext.dataset.mode = 'restart';
    } else {
      celebrateEmoji.textContent = '🎉';
      celebrateTitle.textContent = 'أحسنت!';
      celebrateSub.textContent = 'أجبت بشكل صحيح ٥ مرات متتالية! هيا للمستوى التالي';
      btnNext.textContent = 'المستوى التالي ▶';
      btnNext.dataset.mode = 'next';
    }
    showScreen(screenCelebrate);
  }

  btnNext.addEventListener('click', () => {
    if(btnNext.dataset.mode === 'restart'){
      resetActivity();
      showScreen(screenStart);
    } else {
      levelIndex++;
      streak = 0;
      lastOrder = null;
      showScreen(screenGame);
      buildRound();
    }
  });

  btnReplay.addEventListener('click', () => {
    playAudio(audioLion);
  });

  btnStart.addEventListener('click', () => {
    levelIndex = 0;
    streak = 0;
    showScreen(screenGame);
    buildRound();
  });

  function resetActivity(){
    levelIndex = 0;
    streak = 0;
    locked = false;
    lastOrder = null;
  }

  btnRestartGame.addEventListener('click', () => {
    resetActivity();
    showScreen(screenStart);
  });

})();
</script>

<!-- Child voice recording + mom review -->
<script>
(function(){
  const btnRecord = document.getElementById('btn-record');
  const btnPlayback = document.getElementById('btn-playback');
  const recordStatus = document.getElementById('record-status');
  const momReview = document.getElementById('mom-review');
  const btnSuccess = document.getElementById('btn-success');
  const btnNeedsReview = document.getElementById('btn-needs-review');
  const momResult = document.getElementById('mom-result');
  const audioContainer = document.getElementById('recorded-audio-container');

  let mediaRecorder = null;
  let audioChunks = [];
  let recordedBlobUrl = null;
  let isRecording = false;
  let recordedAudioEl = null;

  function pickMimeType(){
    const candidates = [
      'audio/mp4',
      'audio/aac',
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus'
    ];
    for(const type of candidates){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)){
        return type;
      }
    }
    return '';
  }

  btnRecord.addEventListener('click', async () => {
    if(isRecording){
      if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      return;
    }

    if(!window.MediaRecorder){
      recordStatus.textContent = '⚠️ التسجيل غير مدعوم في هذا المتصفح';
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      recordStatus.textContent = '⚠️ الوصول للميكروفون غير مدعوم في هذا المتصفح';
      return;
    }

    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      const mimeType = pickMimeType();
      mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => { if(e.data && e.data.size > 0) audioChunks.push(e.data); };

      mediaRecorder.onstop = () => {
        const blobType = mediaRecorder.mimeType || 'audio/webm';
        const blob = new Blob(audioChunks, { type: blobType });
        if(recordedBlobUrl) URL.revokeObjectURL(recordedBlobUrl);
        recordedBlobUrl = URL.createObjectURL(blob);

        audioContainer.innerHTML = '';
        recordedAudioEl = document.createElement('audio');
        recordedAudioEl.src = recordedBlobUrl;
        recordedAudioEl.controls = true;
        recordedAudioEl.style.width = '100%';
        recordedAudioEl.style.marginTop = '10px';
        recordedAudioEl.style.borderRadius = '12px';
        audioContainer.appendChild(recordedAudioEl);

        btnPlayback.disabled = false;
        recordStatus.textContent = '✅ تم التسجيل! اضغط للاستماع';
        momReview.style.display = 'block';
        momResult.textContent = '';
        btnSuccess.classList.remove('selected');
        btnNeedsReview.classList.remove('selected');
        stream.getTracks().forEach(t => t.stop());
        isRecording = false;
        btnRecord.classList.remove('recording');
        btnRecord.textContent = '🎤 سجل صوتك';
      };

      mediaRecorder.start();
      isRecording = true;
      btnRecord.classList.add('recording');
      btnRecord.textContent = '⏹️ إيقاف التسجيل';
      recordStatus.textContent = '⏺️ جاري التسجيل...';
    }catch(err){
      recordStatus.textContent = '⚠️ تعذّر الوصول إلى الميكروفون (تأكد من منح الإذن للمتصفح)';
    }
  });

  btnPlayback.addEventListener('click', () => {
    if(!recordedAudioEl){
      recordStatus.textContent = '⚠️ لا يوجد تسجيل بعد، اضغط "سجل صوتك" أولاً';
      return;
    }
    try{
      recordedAudioEl.currentTime = 0;
      const playPromise = recordedAudioEl.play();
      if(playPromise && playPromise.catch){
        playPromise.catch(() => {
          recordStatus.textContent = '⚠️ تعذّر التشغيل التلقائي، استخدم شريط التشغيل الظاهر أسفل الحالة';
        });
      }
      recordStatus.textContent = '🔊 يتم تشغيل صوت الطفل...';
      recordedAudioEl.onended = () => { recordStatus.textContent = '✅ تم التسجيل! اضغط للاستماع'; };
    }catch(e){
      recordStatus.textContent = '⚠️ تعذّر تشغيل الصوت، استخدم شريط التشغيل الظاهر أسفل الحالة';
    }
  });

  btnSuccess.addEventListener('click', () => {
    btnSuccess.classList.add('selected');
    btnNeedsReview.classList.remove('selected');
    momResult.textContent = '🌟 أحسنت! تم اعتماد النطق بنجاح';
  });

  btnNeedsReview.addEventListener('click', () => {
    btnNeedsReview.classList.add('selected');
    btnSuccess.classList.remove('selected');
    momResult.textContent = '👩 تم الحفظ ليستمع إليه الأم لاحقاً';
  });
})();
</script>
